[build]
builder = "nixpacks"

[variables]
PYTHON_VERSION = "3.11"
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
UVICORN_LOOP = "uvloop"
UVICORN_HTTP = "httptools"

[service]
nixpacks = ["python"]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 3 --loop uvloop --http httptools --limit-concurrency 256 --backlog 1024"
healthUrl = "http://localhost/health"

[volumes]
exams_storage = "/data/exams"
backups = "/data/backups"
